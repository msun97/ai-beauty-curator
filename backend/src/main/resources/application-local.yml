# 로컬 개발용 설정 (SPRING_PROFILES_ACTIVE=local)
spring:
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    jwt:
      secret: local-dev-only-secret-change-me-0123456789   # 로컬 전용 값. 운영에서 사용 금지
    cookie:
      secure: false        # http://localhost 에서도 쿠키가 전송되도록
    login:
      email-key-secret: local-dev-only-login-email-key-0123456789
  mail:
    provider: ${MAIL_PROVIDER:log}   # 기본은 재설정 링크·인증 코드를 로그로 출력. .env.local에 MAIL_PROVIDER=smtp를 넣으면 실제 발송
