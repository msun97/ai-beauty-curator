spring:
  application:
    name: api
  config:
    # 로컬 비밀값(API 키 등). .gitignore 대상이고, 파일이 없으면 무시한다.
    # backend 폴더에서 실행할 때와 프로젝트 루트에서 실행할 때를 모두 지원한다
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:./backend/.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aibeauty}
    username: ${DB_USERNAME:aibeauty}
    password: ${DB_PASSWORD:aibeauty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 변경한다
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8090}

logging:
  pattern:
    # 모든 로그 줄에 요청 추적 ID를 남긴다 (NFR-REL-04, TraceIdFilter)
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  auth:
    jwt:
      secret: ${JWT_SECRET:}            # 32바이트 이상 필수. 운영은 환경 변수로만 주입
      issuer: aibeauty-api
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      refresh-reuse-grace: 10s          # 방금 사용된 Refresh Token이 다시 와도 동시 요청으로 봐줄 시간 (0s = 바로 탈취로 판단)
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    login:
      max-failures: 5
      lock-duration: 10m
      email-key-secret: ${LOGIN_EMAIL_KEY_SECRET:}  # 32바이트 이상 필수. 로그인 실패 기록의 이메일 HMAC 키 (FIX-006). 운영은 환경 변수로만 주입
    password-reset:
      token-ttl: 30m
      link-base-url: ${FRONTEND_BASE_URL:http://localhost:3100}/reset-password
    terms-version: "2026-11"
  mail:
    provider: ${MAIL_PROVIDER:}         # 운영 메일 구현 추가 전까지 비워 둠 (로컬은 log)
  import:
    mfds-ingredients:                   # 식약처 화장품 원료성분정보 (import 프로필에서만 사용)
      api-key: ${MFDS_API_KEY:}
      page-size: 500
      request-interval: 300ms
