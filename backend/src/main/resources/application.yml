spring:
  application:
    name: api
  config:
    # 로컬 비밀값(API 키 등). .gitignore 대상이고, 파일이 없으면 무시한다.
    # backend 폴더에서 실행할 때와 프로젝트 루트에서 실행할 때를 모두 지원한다
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:./backend/.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aibeauty}
    username: ${DB_USERNAME:aibeauty}
    password: ${DB_PASSWORD:aibeauty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 변경한다
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 메일 SMTP 서버 (app.mail.provider=smtp일 때만 사용, FIX-008)
  # Gmail: 2단계 인증을 켠 계정의 "앱 비밀번호"를 MAIL_PASSWORD로 넣는다
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8090}

logging:
  pattern:
    # 모든 로그 줄에 요청 추적 ID를 남긴다 (NFR-REL-04, TraceIdFilter)
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
  health:
    mail:
      enabled: false   # 헬스 체크마다 SMTP에 접속하지 않게 한다 (메일 서버 문제로 서버가 DOWN 처리되지 않도록)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  auth:
    jwt:
      secret: ${JWT_SECRET:}            # 32바이트 이상 필수. 운영은 환경 변수로만 주입
      issuer: aibeauty-api
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      refresh-reuse-grace: 10s          # 방금 사용된 Refresh Token이 다시 와도 동시 요청으로 봐줄 시간 (0s = 바로 탈취로 판단)
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    login:
      max-failures: 5
      lock-duration: 10m
      email-key-secret: ${LOGIN_EMAIL_KEY_SECRET:}  # 32바이트 이상 필수. 로그인 실패 기록의 이메일 HMAC 키 (FIX-006). 운영은 환경 변수로만 주입
      cleanup-cron: "0 0 * * * *"       # 하루 지난 로그인 실패 기록 정리 (매시 정각, "-"이면 끔)
    password-reset:
      token-ttl: 30m
      link-base-url: ${FRONTEND_BASE_URL:http://localhost:3100}/reset-password
    terms-version: "2026-11"
  mail:
    provider: ${MAIL_PROVIDER:}         # log(로컬) | smtp(실제 발송). 비우면 기동 실패 (메일 없이 배포 방지)
    from: ${MAIL_FROM:${MAIL_USERNAME:}} # Gmail SMTP는 로그인한 계정 주소와 같아야 함
    from-name: pickly
  import:
    mfds-ingredients:                   # 식약처 화장품 원료성분정보 (import 프로필에서만 사용)
      api-key: ${MFDS_API_KEY:}
      page-size: 500
      request-interval: 300ms
