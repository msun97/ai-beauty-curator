spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aibeauty}
    username: ${DB_USERNAME:aibeauty}
    password: ${DB_PASSWORD:aibeauty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 변경한다
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
