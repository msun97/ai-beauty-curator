# 로컬 개발용 PostgreSQL
# 실행: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: aibeauty-postgres
    environment:
      POSTGRES_DB: aibeauty
      POSTGRES_USER: aibeauty
      POSTGRES_PASSWORD: aibeauty
      TZ: Asia/Seoul
    ports:
      - "5433:5432"   # 로컬에 설치된 PostgreSQL(5432)과 겹치지 않도록 5433 사용
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibeauty -d aibeauty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
